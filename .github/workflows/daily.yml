name: Monitoreo diario de precios

# SIN horario automatico, a proposito.
#
# Amazon bloquea las IP de los runners de GitHub (rangos de datacenter):
# el 21/07/2026 fallaron 7 de 8 consultas incluso con pausas de 10-28s,
# porque el bloqueo es por procedencia y no por ritmo. El monitoreo diario
# corre ahora desde el PC del usuario (IP residencial) via el Programador
# de tareas de Windows, con correr_diario.bat.
#
# Este workflow queda solo como respaldo manual.
on:
  workflow_dispatch:

permissions:
  contents: write           # necesario para versionar el historico

concurrency:
  group: precios
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Monitorear precios y enviar alertas
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          PRICE_PROVIDER: ${{ vars.PRICE_PROVIDER || 'amazon_scraper' }}
          # URL publico de la hoja de respuestas del formulario de Google.
          # No es un secreto: se configura en Settings > Variables.
          FORM_CSV_URL: ${{ vars.FORM_CSV_URL }}
          FORM_URL: ${{ vars.FORM_URL }}
          KEEPA_API_KEY: ${{ secrets.KEEPA_API_KEY }}
        run: python -m src.main track

      - name: Guardar historico y publicar la pagina
        run: |
          git config user.name "radar-relojes"
          git config user.email "actions@github.com"
          git add data/prices.db data/watches.csv reports/ docs/ || true
          git diff --staged --quiet || git commit -m "precios $(date -u +%Y-%m-%d)"
          git push
