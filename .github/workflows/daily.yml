name: Monitoreo diario de precios

on:
  schedule:
    # 12:15 UTC = 07:15 Colombia. Minuto no redondo: GitHub encola menos.
    - cron: "15 12 * * *"
  workflow_dispatch:        # boton para correrlo a mano

permissions:
  contents: write           # necesario para versionar el historico

concurrency:
  group: precios
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Monitorear precios y enviar alertas
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          PRICE_PROVIDER: ${{ vars.PRICE_PROVIDER || 'amazon_scraper' }}
          KEEPA_API_KEY: ${{ secrets.KEEPA_API_KEY }}
        run: python -m src.main track

      - name: Guardar historico y publicar la pagina
        run: |
          git config user.name "radar-relojes"
          git config user.email "actions@github.com"
          git add data/prices.db data/watches.csv reports/ docs/ || true
          git diff --staged --quiet || git commit -m "precios $(date -u +%Y-%m-%d)"
          git push
