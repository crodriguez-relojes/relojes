<!DOCTYPE html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head>
<body style="margin:0;padding:0;background:#0f1115;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#0f1115;padding:24px 12px;">
<tr><td align="center">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:680px;background:#171a21;border-radius:14px;overflow:hidden;border:1px solid #262b36;">

  <tr><td style="padding:22px 26px;background:linear-gradient(135deg,#1b2030,#12151c);border-bottom:1px solid #262b36;">
    <div style="font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#7b8494;">Radar de Relojes</div>
    <div style="font-size:21px;font-weight:700;color:#f2f4f8;margin-top:4px;">{% block title %}{% endblock %}</div>
    <div style="font-size:12px;color:#7b8494;margin-top:3px;">{{ generated_at }}</div>
  </td></tr>

  <tr><td style="padding:22px 26px;color:#c9d0dc;font-size:14px;line-height:1.55;">
    {% block content %}{% endblock %}
  </td></tr>

  <tr><td style="padding:16px 26px;border-top:1px solid #262b36;color:#5f6875;font-size:11px;line-height:1.5;">
    Generado automaticamente por tu sistema de inteligencia de compras.<br>
    Los precios de Amazon cambian sin aviso: confirma en el link antes de pagar.
  </td></tr>

</table>
</td></tr></table>
</body></html>
